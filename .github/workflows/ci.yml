name: CI

on:
  push:
    branches: [ main ]
    # Release tags also start the EAS builds in mobile_build.
    tags: [ 'mobile-*', 'release-*' ]
  pull_request:
  schedule:
    # Ночные прогоны, в том числе для E2E
    - cron: '0 2 * * *'

jobs:
  lint_typecheck:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node & pnpm
        uses: pnpm/action-setup@v4

      - name: Use Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'pnpm'

      - name: Install deps (workspace)
        run: pnpm install --frozen-lockfile

      - name: ESLint (root tooling + apps/web)
        run: pnpm lint

      - name: Check active docs links
        run: pnpm check:docs-links

      - name: Check i18n dictionaries (locale parity + undefined keys ratchet)
        run: pnpm check:i18n

      - name: Check source encoding (invalid UTF-8, Windows-1251 mojibake)
        run: |
          node --test scripts/check-encoding.test.mjs
          pnpm check:encoding

      - name: Check server 5xx responses leave a log line (ARCH-04)
        run: |
          node --test scripts/check-silent-server-errors.test.mjs
          pnpm check:silent-errors

      - name: Check offline OpenAPI, SDK and typed consumer
        run: |
          pnpm check:openapi
          node --test scripts/openapi-tools.test.mjs

      - name: Shared client types and unit tests
        run: |
          pnpm -C packages/shared-client typecheck
          pnpm -C packages/shared-client test --runInBand --watchAll=false

      - name: Check SQL runner failure propagation
        run: node --test scripts/sql-runner.test.mjs scripts/isolated-sql-runner.test.mjs scripts/live-schema.test.mjs scripts/sql-suite-parity.test.mjs

      - name: Load-test guard refuses non-local targets (R25-28)
        run: node --test scripts/load/load.test.mjs

      - name: Core domain tests (booking, finance, schedule rules shared by web and mobile)
        run: pnpm -C packages/core-domain exec jest --ci

      - name: Check generated cron manifests
        run: pnpm check:crons

      - name: Check hotspot size guardrails
        run: pnpm check:hotspots

      - name: Typecheck (web + mobile)
        run: pnpm typecheck

  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node & pnpm
        uses: pnpm/action-setup@v4

      - name: Use Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'pnpm'

      - name: Install deps (root)
        run: pnpm install --frozen-lockfile

      - name: Build web app
        working-directory: apps/web
        env:
          SENTRY_ORG: ${{ secrets.SENTRY_ORG }}
          SENTRY_PROJECT: ${{ secrets.SENTRY_PROJECT }}
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
          # Placeholders for build-time only (prerender); runtime uses real values in deployment
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL || 'https://placeholder.supabase.co' }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY || 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.placeholder' }}
        run: pnpm build

  web_full_tests:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node & pnpm
        uses: pnpm/action-setup@v4

      - name: Use Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'pnpm'

      - name: Install deps (root)
        run: pnpm install --frozen-lockfile

      - name: Run all web Jest suites with the coverage ratchet (jest.config.js)
        run: pnpm test:coverage --ci --watchAll=false --maxWorkers=50%
        working-directory: apps/web

  e2e_smoke_tests:
    # Pinned: `playwright install --with-deps` needs an OS release the pinned
    # Playwright knows; ubuntu-latest moved to 26.04 in October 2026.
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node & pnpm
        uses: pnpm/action-setup@v4

      - name: Use Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'pnpm'

      - name: Install deps (root)
        run: pnpm install --frozen-lockfile

      - name: Install Playwright browsers
        run: pnpm exec playwright install --with-deps chromium
        working-directory: apps/web

      - name: Run E2E smoke tests
        # Public pages without a database: placeholder Supabase values, no service-role key.
        env:
          NEXT_PUBLIC_SUPABASE_URL: 'https://placeholder.supabase.co'
          NEXT_PUBLIC_SUPABASE_ANON_KEY: 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.placeholder'
        run: pnpm test:e2e:smoke
        working-directory: apps/web

      - name: Upload smoke test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-smoke-report
          path: apps/web/playwright-report/
          retention-days: 30

  e2e_visual_regressions:
    # Pinned: `playwright install --with-deps` needs an OS release the pinned
    # Playwright knows; ubuntu-latest moved to 26.04 in October 2026.
    # Baselines in apps/web/e2e/visual-regressions.spec.ts-snapshots are *-chromium-linux.png.
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node & pnpm
        uses: pnpm/action-setup@v4

      - name: Use Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'pnpm'

      - name: Install deps (root)
        run: pnpm install --frozen-lockfile

      - name: Install Playwright browsers
        run: pnpm exec playwright install --with-deps chromium
        working-directory: apps/web

      # Self-contained: a local Supabase stack (prod baseline + migrations + seed, as db_bootstrap)
      # and the e2e fixture. No secrets, no remote project; playwright.config.ts refuses non-local URLs.
      - name: Start local Supabase (applies baseline, migrations and seed)
        run: pnpm db:start:check

      - name: Seed the e2e fixture and export its env (local test accounts and ids)
        run: node scripts/e2e-seed.mjs >> "$GITHUB_ENV"

      - name: Check the fixture env
        run: |
          for v in NEXT_PUBLIC_SUPABASE_URL NEXT_PUBLIC_SUPABASE_ANON_KEY SUPABASE_SERVICE_ROLE_KEY E2E_TEST_PASSWORD                    E2E_TEST_BUSINESS_SLUG E2E_TEST_BUSINESS_ID E2E_TEST_BRANCH_ID E2E_TEST_STAFF_ID                    E2E_TEST_MANAGER_EMAIL E2E_TEST_STAFF_EMAIL E2E_TEST_CLIENT_EMAIL E2E_TEST_SUPER_ADMIN_EMAIL                    E2E_TEST_MULTI_ROLE_EMAIL WHATSAPP_APP_SECRET WHATSAPP_PHONE_NUMBER_ID; do
            if [ -z "${!v}" ]; then
              echo "Missing e2e fixture env: $v"
              exit 1
            fi
          done

      - name: Run visual regression suite
        run: pnpm test:e2e:visual
        working-directory: apps/web

      - name: Upload visual regression results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-visual-regressions-report
          path: |
            apps/web/playwright-report/
            apps/web/test-results/
          retention-days: 30

      - name: Stop local Supabase
        if: always()
        run: pnpm exec supabase stop --no-backup

  e2e_tests:
    # Pinned: `playwright install --with-deps` needs an OS release the pinned
    # Playwright knows; ubuntu-latest moved to 26.04 in October 2026.
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node & pnpm
        uses: pnpm/action-setup@v4

      - name: Use Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'pnpm'

      - name: Install deps (root)
        run: pnpm install --frozen-lockfile

      - name: Install Playwright browsers
        run: pnpm exec playwright install --with-deps chromium
        working-directory: apps/web

      # Self-contained: a local Supabase stack (prod baseline + migrations + seed, as db_bootstrap)
      # and the e2e fixture. No secrets, no remote project; playwright.config.ts refuses non-local URLs.
      - name: Start local Supabase (applies baseline, migrations and seed)
        run: pnpm db:start:check

      - name: Seed the e2e fixture and export its env (local test accounts and ids)
        run: node scripts/e2e-seed.mjs >> "$GITHUB_ENV"

      - name: Check the fixture env
        run: |
          for v in NEXT_PUBLIC_SUPABASE_URL NEXT_PUBLIC_SUPABASE_ANON_KEY SUPABASE_SERVICE_ROLE_KEY E2E_TEST_PASSWORD                    E2E_TEST_BUSINESS_SLUG E2E_TEST_BUSINESS_ID E2E_TEST_BRANCH_ID E2E_TEST_STAFF_ID                    E2E_TEST_MANAGER_EMAIL E2E_TEST_STAFF_EMAIL E2E_TEST_CLIENT_EMAIL E2E_TEST_SUPER_ADMIN_EMAIL                    E2E_TEST_MULTI_ROLE_EMAIL WHATSAPP_APP_SECRET WHATSAPP_PHONE_NUMBER_ID; do
            if [ -z "${!v}" ]; then
              echo "Missing e2e fixture env: $v"
              exit 1
            fi
          done

      - name: Run E2E tests
        run: pnpm test:e2e:full-seeded
        working-directory: apps/web

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            apps/web/playwright-report/
            apps/web/test-results/
          retention-days: 30

      - name: Stop local Supabase
        if: always()
        run: pnpm exec supabase stop --no-backup

  mobile_tests:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node & pnpm
        uses: pnpm/action-setup@v4

      - name: Use Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'pnpm'

      - name: Install deps (root)
        run: pnpm install --frozen-lockfile

      - name: Run mobile smoke tests
        run: pnpm test:runInBand
        working-directory: apps/mobile

  mobile_build:
    # Every run bundles the Android and iOS apps with Metro (no credentials). Release tags
    # (mobile-*, release-*) also start EAS builds; without EXPO_TOKEN those steps skip.
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node & pnpm
        uses: pnpm/action-setup@v4

      - name: Use Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'pnpm'

      - name: Install deps (root)
        run: pnpm install --frozen-lockfile

      - name: Bundle Android and iOS apps
        working-directory: apps/mobile
        env:
          EXPO_OFFLINE: '1'
        run: |
          pnpm exec expo export --platform android --output-dir dist/android
          pnpm exec expo export --platform ios --output-dir dist/ios

      - name: Install EAS CLI
        if: startsWith(github.ref, 'refs/tags/mobile-') || startsWith(github.ref, 'refs/tags/release-')
        run: pnpm add -g eas-cli

      - name: Build Android app with EAS
        if: startsWith(github.ref, 'refs/tags/mobile-') || startsWith(github.ref, 'refs/tags/release-')
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
        working-directory: apps/mobile
        run: |
          if [ -z "$EXPO_TOKEN" ]; then
            echo "⚠️ EXPO_TOKEN не задан, пропускаем EAS Android build"
            exit 0
          fi
          eas build --platform android --profile production --non-interactive --no-wait

      - name: Build iOS app with EAS
        if: startsWith(github.ref, 'refs/tags/mobile-') || startsWith(github.ref, 'refs/tags/release-')
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
        working-directory: apps/mobile
        run: |
          if [ -z "$EXPO_TOKEN" ]; then
            echo "⚠️ EXPO_TOKEN не задан, пропускаем EAS iOS build"
            exit 0
          fi
          eas build --platform ios --profile production --non-interactive --no-wait

  # Required synthetic PostgreSQL gates. No linked project, secrets, host ports or provider calls.
  db_bootstrap:
    # Clean database from the repository: prod baseline + migrations + seed,
    # then generated types must match. No linked project or secrets.
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node & pnpm
        uses: pnpm/action-setup@v4

      - name: Use Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'pnpm'

      - name: Install deps (workspace)
        run: pnpm install --frozen-lockfile

      - name: Start local Supabase (applies baseline, migrations and seed)
        run: pnpm db:start:check

      - name: Re-run from scratch with db reset
        run: pnpm exec supabase db reset

      - name: Generated database types match the schema
        run: pnpm check:db-types

      - name: SQL functions pass plpgsql_check
        run: pnpm check:sql-functions

      - name: Function catalog matches the migrations
        run: pnpm check:function-catalog

      - name: SQL scenarios on the full chain (one rolled-back transaction)
        env:
          SUPABASE_DB_URL: postgresql://postgres:postgres@127.0.0.1:54322/postgres
        run: pnpm test:sql

      - name: Stop local Supabase
        if: always()
        run: pnpm exec supabase stop --no-backup

  sql_tests:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        runner:
          - test-mobile-auth-grants-isolated.cjs
          - test-finance-transactions.mjs
          - test-booking-requests-isolated.cjs
          - test-booking-notification-outbox-isolated.cjs
          - test-staff-scoped-slots-isolated.cjs
          - test-cron-execution-isolated.cjs
          - test-reporting-completeness.mjs
          - test-shift-close-backlog.mjs
          - test-whatsapp-inbox-isolated.cjs
          - test-booking-finance-boundary-isolated.mjs
          - test-attendance-command-isolated.mjs
          - test-shift-hours-adjustment-isolated.mjs
          - test-platform-admin-commands-isolated.cjs
          - test-privileged-maintenance-isolated.cjs
          - test-user-lifecycle-isolated.cjs
          - test-identity-surface-hardening-isolated.cjs
          - test-identity-views-row-filter-isolated.cjs
          - test-spatial-ref-sys-guard-isolated.cjs
          - test-service-only-definer-functions-isolated.cjs
          - test-internal-tables-access-isolated.cjs
          - test-staff-private-fields-isolated.cjs
          - test-client-write-paths-isolated.cjs
          - test-bookings-read-scope-isolated.cjs
          - test-booking-service-staff-isolated.cjs
          - test-tenant-reference-guards-isolated.cjs
          - test-staff-delete-isolated.cjs
          - test-release-unconfirmed-phone-isolated.cjs
          - test-duplicate-indexes-isolated.cjs
          - test-notification-email-proven-sources-isolated.cjs
          - test-review-write-rules-isolated.cjs
          - test-one-active-date-rule-isolated.cjs
          - test-admin-user-directory-isolated.cjs
          - test-dashboard-bookings-page-isolated.cjs
          - test-maintenance-scan-indexes-isolated.cjs
          - test-release-auth-phone-isolated.cjs
          - test-analytics-ingest-guards-isolated.cjs
          - test-keep-history-on-delete-isolated.cjs
          - test-value-range-checks-isolated.cjs
          - test-visit-package-sale-identity-isolated.cjs
          - test-closed-default-privileges-isolated.cjs
          - test-rls-policy-hygiene-isolated.cjs
          - test-inactive-rows-visibility-isolated.cjs
          - test-staff-role-follows-card-isolated.cjs
          - test-public-booking-receipt.mjs
          - test-telegram-profile-link-db.mjs
          - test-telegram-web-login-db.mjs
          - test-explicit-schedules-db.mjs
          - test-explicit-schedules-concurrency.mjs
          - test-schedule-absence.mjs
          - test-schedule-reset.mjs
          - test-simple-schedule-booking-writer.mjs
          - test-guest-schedule-booking-writer.mjs
          - test-complex-booking-identity.mjs
          - test-rating-functions-service-only-isolated.cjs
          - test-service-group-update-isolated.cjs
          - test-one-super-admin-rule-isolated.cjs
          - test-staff-invitations-isolated.cjs
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Use Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Pull disposable PostgreSQL image (the version production runs)
        run: |
          # Docker Hub pulls fail now and then on shared runners; retry before failing the job.
          # The user-lifecycle suite also starts Node, GoTrue and PostgREST containers: pull them
          # here with retries too, so a registry hiccup does not fail the suite in its first seconds.
          images="$(node scripts/lib/isolated-postgres.cjs)"
          if [ "${{ matrix.runner }}" = "test-user-lifecycle-isolated.cjs" ]; then
            images="$images node:22-alpine public.ecr.aws/supabase/gotrue:v2.180.0 public.ecr.aws/supabase/postgrest:v13.0.7"
          fi
          for image in $images; do
            for attempt in 1 2 3 4; do
              docker pull "$image" && continue 2
              echo "docker pull $image failed (attempt $attempt), retrying"
              sleep $((attempt * 15))
            done
            exit 1
          done

      - name: Run isolated SQL contracts
        run: node scripts/${{ matrix.runner }}

  redis_tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Pull disposable Redis image
        run: |
          # Docker Hub pulls fail now and then on shared runners; retry before failing the job.
          for attempt in 1 2 3 4; do
            docker pull redis:7-alpine && exit 0
            echo "docker pull redis:7-alpine failed (attempt $attempt), retrying"
            sleep $((attempt * 15))
          done
          exit 1
      - name: Run atomic rate-limit contracts
        run: |
          node scripts/test-rate-limit-isolated.mjs
          node scripts/test-performance-metrics-isolated.mjs

  security_audit:
    runs-on: ubuntu-latest
    # Аудит уязвимостей имеет смысл на pull_request и по расписанию (schedule уже задан выше)
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Use Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'pnpm'

      - name: Install deps (root)
        run: pnpm install --frozen-lockfile

      - name: Run pnpm audit (high severity)
        run: pnpm audit --audit-level=high || (echo "⚠️ Обнаружены уязвимости уровня high+ — проверьте отчёт audit" && exit 1)

