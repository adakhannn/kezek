name: CI

on:
  push:
    branches: [ main ]
  pull_request:
  schedule:
    # Ночные прогоны, в том числе для E2E
    - cron: '0 2 * * *'

jobs:
  lint_typecheck:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node & pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Use Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'pnpm'

      - name: Install deps (root)
        run: pnpm install --frozen-lockfile

      - name: Install deps (apps/web)
        run: pnpm install --frozen-lockfile
        working-directory: apps/web

      - name: ESLint
        run: pnpm lint

      - name: Check active docs links
        run: pnpm check:docs-links

      - name: Check offline OpenAPI, SDK and typed consumer
        run: |
          pnpm check:openapi
          node --test scripts/openapi-tools.test.mjs

      - name: Shared client types and unit tests
        run: |
          pnpm -C packages/shared-client typecheck
          pnpm -C packages/shared-client test --runInBand --watchAll=false

      - name: Check SQL runner failure propagation
        run: node --test scripts/sql-runner.test.mjs scripts/isolated-sql-runner.test.mjs

      - name: Check generated cron manifests
        run: pnpm check:crons

      - name: Check hotspot size guardrails
        run: pnpm check:hotspots

      - name: Typecheck
        run: pnpm typecheck

  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node & pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Use Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'pnpm'

      - name: Install deps (root)
        run: pnpm install --frozen-lockfile

      - name: Build web app
        working-directory: apps/web
        env:
          SENTRY_ORG: ${{ secrets.SENTRY_ORG }}
          SENTRY_PROJECT: ${{ secrets.SENTRY_PROJECT }}
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
          # Placeholders for build-time only (prerender); runtime uses real values in deployment
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL || 'https://placeholder.supabase.co' }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY || 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.placeholder' }}
        run: pnpm build

  web_core_tests:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node & pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Use Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'pnpm'

      - name: Install deps (root)
        run: pnpm install --frozen-lockfile

      - name: Install deps (apps/web)
        run: pnpm install --frozen-lockfile
        working-directory: apps/web

      - name: Run core web coverage gate
        run: pnpm test:ci:core
        working-directory: apps/web

      - name: Check coverage threshold
        run: |
          echo "✅ Покрытие тестами проверено автоматически через coverageThreshold в jest.config.js"
          echo "Текущий минимальный порог: 60% (statements/branches/functions/lines)"
          echo "Источник истины для порога: apps/web/jest.config.js"
        working-directory: apps/web

  web_full_tests:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node & pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Use Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'pnpm'

      - name: Install deps (root)
        run: pnpm install --frozen-lockfile

      - name: Install deps (apps/web)
        run: pnpm install --frozen-lockfile
        working-directory: apps/web

      - name: Run all web Jest suites including components
        run: pnpm test --ci --watchAll=false --maxWorkers=50%
        working-directory: apps/web

  e2e_smoke_tests:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node & pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Use Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'pnpm'

      - name: Install deps (root)
        run: pnpm install --frozen-lockfile

      - name: Install deps (apps/web)
        run: pnpm install --frozen-lockfile
        working-directory: apps/web

      - name: Install Playwright browsers
        run: pnpm exec playwright install --with-deps chromium
        working-directory: apps/web

      - name: Run E2E smoke tests
        env:
          PLAYWRIGHT_TEST_BASE_URL: ${{ secrets.E2E_TEST_BASE_URL || 'http://localhost:3000' }}
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL || 'https://placeholder.supabase.co' }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY || 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.placeholder' }}
        run: pnpm test:e2e:smoke
        working-directory: apps/web

      - name: Upload smoke test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-smoke-report
          path: apps/web/playwright-report/
          retention-days: 30

  e2e_visual_regressions:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node & pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Use Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'pnpm'

      - name: Install deps (root)
        run: pnpm install --frozen-lockfile

      - name: Install deps (apps/web)
        run: pnpm install --frozen-lockfile
        working-directory: apps/web

      - name: Install Playwright browsers
        run: pnpm exec playwright install --with-deps chromium
        working-directory: apps/web

      - name: Validate visual regression env on main/schedule
        if: github.ref == 'refs/heads/main' || github.event_name == 'schedule'
        env:
          E2E_TEST_BUSINESS_SLUG: ${{ secrets.E2E_TEST_BUSINESS_SLUG }}
          E2E_TEST_MANAGER_EMAIL: ${{ secrets.E2E_TEST_MANAGER_EMAIL }}
          E2E_TEST_STAFF_ID: ${{ secrets.E2E_TEST_STAFF_ID }}
        run: |
          for v in E2E_TEST_BUSINESS_SLUG E2E_TEST_MANAGER_EMAIL E2E_TEST_STAFF_ID; do
            if [ -z "${!v}" ]; then
              echo "Missing required visual regression env: $v"
              exit 1
            fi
          done

      - name: Run visual regression suite
        env:
          PLAYWRIGHT_TEST_BASE_URL: ${{ secrets.E2E_TEST_BASE_URL || 'http://localhost:3000' }}
          E2E_TEST_BUSINESS_SLUG: ${{ secrets.E2E_TEST_BUSINESS_SLUG }}
          E2E_TEST_MANAGER_EMAIL: ${{ secrets.E2E_TEST_MANAGER_EMAIL }}
          E2E_TEST_STAFF_ID: ${{ secrets.E2E_TEST_STAFF_ID }}
          E2E_TEST_STAFF_EMAIL: ${{ secrets.E2E_TEST_STAFF_EMAIL }}
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL || 'https://placeholder.supabase.co' }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY || 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.placeholder' }}
        run: pnpm test:e2e:visual
        working-directory: apps/web

      - name: Upload visual regression results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-visual-regressions-report
          path: apps/web/playwright-report/
          retention-days: 30

  e2e_tests:
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node & pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Use Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'pnpm'

      - name: Install deps (root)
        run: pnpm install --frozen-lockfile

      - name: Install deps (apps/web)
        run: pnpm install --frozen-lockfile
        working-directory: apps/web

      - name: Install Playwright browsers
        run: pnpm exec playwright install --with-deps chromium
        working-directory: apps/web

      - name: Run E2E tests
        env:
          PLAYWRIGHT_TEST_BASE_URL: ${{ secrets.E2E_TEST_BASE_URL || 'http://localhost:3000' }}
          E2E_TEST_BUSINESS_SLUG: ${{ secrets.E2E_TEST_BUSINESS_SLUG }}
          E2E_TEST_MANAGER_EMAIL: ${{ secrets.E2E_TEST_MANAGER_EMAIL }}
          E2E_TEST_STAFF_ID: ${{ secrets.E2E_TEST_STAFF_ID }}
          E2E_TEST_STAFF_EMAIL: ${{ secrets.E2E_TEST_STAFF_EMAIL }}
          E2E_TEST_STAFF_PASSWORD: ${{ secrets.E2E_TEST_STAFF_PASSWORD }}
        run: pnpm test:e2e:full-seeded
        working-directory: apps/web

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: apps/web/playwright-report/
          retention-days: 30

  mobile_tests:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node & pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Use Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'pnpm'

      - name: Install deps (root)
        run: pnpm install --frozen-lockfile

      - name: Install deps (apps/mobile)
        run: pnpm install --frozen-lockfile
        working-directory: apps/mobile

      - name: Run mobile smoke tests
        run: pnpm test:runInBand
        working-directory: apps/mobile

      - name: Check smoke tests status
        run: |
          echo "✅ Smoke-тесты для mobile приложения проверены"
          echo "Базовый набор тестов должен проходить перед каждым релизом:"
          echo "- Auth экраны (SignIn, SignUp, Verify, WhatsApp)"
          echo "- Основные экраны (StaffScreen, CabinetScreen, BookingDetailsScreen)"
          echo "- Навигация между шагами бронирования"
        working-directory: apps/mobile

  mobile_build:
    # Запуск сборки mobile по тегам релизов; при отсутствии токенов EAS шаги пропускаются
    if: startsWith(github.ref, 'refs/tags/mobile-') || startsWith(github.ref, 'refs/tags/release-')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node & pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Use Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'pnpm'

      - name: Install deps (root)
        run: pnpm install --frozen-lockfile

      - name: Install deps (apps/mobile)
        run: pnpm install --frozen-lockfile
        working-directory: apps/mobile

      - name: Install EAS CLI
        run: pnpm add -g eas-cli

      - name: Build Android app with EAS
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
        working-directory: apps/mobile
        run: |
          if [ -z "$EXPO_TOKEN" ]; then
            echo "⚠️ EXPO_TOKEN не задан, пропускаем EAS Android build"
            exit 0
          fi
          eas build --platform android --profile production --non-interactive --no-wait

      - name: Build iOS app with EAS
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
        working-directory: apps/mobile
        run: |
          if [ -z "$EXPO_TOKEN" ]; then
            echo "⚠️ EXPO_TOKEN не задан, пропускаем EAS iOS build"
            exit 0
          fi
          eas build --platform ios --profile production --non-interactive --no-wait

  # Required synthetic PostgreSQL gates. No linked project, secrets, host ports or provider calls.
  sql_tests:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        runner:
          - test-mobile-auth-grants-isolated.cjs
          - test-finance-transactions.mjs
          - test-booking-requests-isolated.cjs
          - test-booking-notification-outbox-isolated.cjs
          - test-staff-scoped-slots-isolated.cjs
          - test-cron-execution-isolated.cjs
          - test-reporting-completeness.mjs
          - test-shift-close-backlog.mjs
          - test-whatsapp-inbox-isolated.cjs
          - test-booking-finance-boundary-isolated.mjs
          - test-attendance-command-isolated.mjs
          - test-shift-hours-adjustment-isolated.mjs
          - test-platform-admin-commands-isolated.cjs
          - test-privileged-maintenance-isolated.cjs
          - test-user-lifecycle-isolated.cjs
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Use Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Pull disposable PostgreSQL image
        run: docker pull postgres:16

      - name: Run isolated SQL contracts
        run: node scripts/${{ matrix.runner }}

  redis_tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Pull disposable Redis image
        run: docker pull redis:7-alpine
      - name: Run atomic rate-limit contracts
        run: |
          node scripts/test-rate-limit-isolated.mjs
          node scripts/test-performance-metrics-isolated.mjs

  security_audit:
    runs-on: ubuntu-latest
    # Аудит уязвимостей имеет смысл на pull_request и по расписанию (schedule уже задан выше)
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Use Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'pnpm'

      - name: Install deps (root)
        run: pnpm install --frozen-lockfile

      - name: Run pnpm audit (high severity)
        run: pnpm audit --audit-level=high || (echo "⚠️ Обнаружены уязвимости уровня high+ — проверьте отчёт audit" && exit 1)

