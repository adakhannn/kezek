name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  lint-and-typecheck:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint web app
        run: pnpm -C apps/web lint

      - name: Typecheck web app
        run: pnpm -C apps/web typecheck

name: CI

on:
  push:
    branches: [ main ]
  pull_request:
  schedule:
    # Ночные прогоны, в том числе для E2E
    - cron: '0 2 * * *'

jobs:
  lint_typecheck:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node & pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Use Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'pnpm'

      - name: Install deps (root)
        run: pnpm install --frozen-lockfile

      - name: Install deps (apps/web)
        run: pnpm install --frozen-lockfile
        working-directory: apps/web

      - name: ESLint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node & pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Use Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'pnpm'

      - name: Install deps (root)
        run: pnpm install --frozen-lockfile

      - name: Build web app
        working-directory: apps/web
        env:
          SENTRY_ORG: ${{ secrets.SENTRY_ORG }}
          SENTRY_PROJECT: ${{ secrets.SENTRY_PROJECT }}
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
        run: pnpm build

  api_tests:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node & pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Use Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'pnpm'

      - name: Install deps (root)
        run: pnpm install --frozen-lockfile

      - name: Install deps (apps/web)
        run: pnpm install --frozen-lockfile
        working-directory: apps/web

      - name: Run API tests with coverage
        run: pnpm test:coverage
        working-directory: apps/web

      - name: Check coverage threshold
        run: |
          echo "✅ Покрытие тестами проверено автоматически через coverageThreshold в jest.config.js"
          echo "Текущий минимальный порог: 40% (statements/branches/functions/lines)"
          echo "По мере добавления тестов порог будет постепенно подниматься до 50%+, 60%+ и т.д."
        working-directory: apps/web

  e2e_tests:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node & pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Use Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'pnpm'

      - name: Install deps (root)
        run: pnpm install --frozen-lockfile

      - name: Install deps (apps/web)
        run: pnpm install --frozen-lockfile
        working-directory: apps/web

      - name: Install Playwright browsers
        run: pnpm exec playwright install --with-deps
        working-directory: apps/web

      - name: Run E2E tests
        env:
          PLAYWRIGHT_TEST_BASE_URL: ${{ secrets.E2E_TEST_BASE_URL || 'http://localhost:3000' }}
          E2E_TEST_BUSINESS_SLUG: ${{ secrets.E2E_TEST_BUSINESS_SLUG }}
          E2E_TEST_STAFF_EMAIL: ${{ secrets.E2E_TEST_STAFF_EMAIL }}
          E2E_TEST_STAFF_PASSWORD: ${{ secrets.E2E_TEST_STAFF_PASSWORD }}
        run: pnpm test:e2e
        working-directory: apps/web

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: apps/web/playwright-report/
          retention-days: 30

  mobile_tests:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node & pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Use Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'pnpm'

      - name: Install deps (root)
        run: pnpm install --frozen-lockfile

      - name: Install deps (apps/mobile)
        run: pnpm install --frozen-lockfile
        working-directory: apps/mobile

      - name: Run mobile smoke tests
        run: pnpm test
        working-directory: apps/mobile

      - name: Check smoke tests status
        run: |
          echo "✅ Smoke-тесты для mobile приложения проверены"
          echo "Базовый набор тестов должен проходить перед каждым релизом:"
          echo "- Auth экраны (SignIn, SignUp, Verify, WhatsApp)"
          echo "- Основные экраны (StaffScreen, CabinetScreen, BookingDetailsScreen)"
          echo "- Навигация между шагами бронирования"
        working-directory: apps/mobile

  mobile_build:
    # Запуск сборки mobile по тегам релизов; при отсутствии токенов EAS шаги пропускаются
    if: startsWith(github.ref, 'refs/tags/mobile-') || startsWith(github.ref, 'refs/tags/release-')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node & pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Use Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'pnpm'

      - name: Install deps (root)
        run: pnpm install --frozen-lockfile

      - name: Install deps (apps/mobile)
        run: pnpm install --frozen-lockfile
        working-directory: apps/mobile

      - name: Install EAS CLI
        run: pnpm add -g eas-cli

      - name: Build Android app with EAS
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
        working-directory: apps/mobile
        run: |
          if [ -z "$EXPO_TOKEN" ]; then
            echo "⚠️ EXPO_TOKEN не задан, пропускаем EAS Android build"
            exit 0
          fi
          eas build --platform android --profile production --non-interactive --no-wait

      - name: Build iOS app with EAS
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
        working-directory: apps/mobile
        run: |
          if [ -z "$EXPO_TOKEN" ]; then
            echo "⚠️ EXPO_TOKEN не задан, пропускаем EAS iOS build"
            exit 0
          fi
          eas build --platform ios --profile production --non-interactive --no-wait

  # SQL тесты запускаются только если есть доступ к тестовой БД
  # Для запуска в CI нужно установить SUPABASE_DB_URL в secrets
  sql_tests:
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request' || github.ref == 'refs/heads/main'
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup PostgreSQL client
        run: |
          sudo apt-get update
          sudo apt-get install -y postgresql-client

      - name: Run SQL tests
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_TEST_DB_URL }}
        run: |
          if [ -n "$SUPABASE_DB_URL" ]; then
            echo "🧪 Запуск критичных SQL-тестов..."
            psql "$SUPABASE_DB_URL" -f supabase/tests_critical_scenarios.sql
            echo "✅ Все тесты пройдены успешно!"
          else
            echo "⚠️ SUPABASE_TEST_DB_URL не установлен, пропускаем SQL тесты"
            echo "Для запуска тестов в CI установите SUPABASE_TEST_DB_URL в secrets"
          fi

  security_audit:
    runs-on: ubuntu-latest
    # Аудит уязвимостей имеет смысл на pull_request и по расписанию (schedule уже задан выше)
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Use Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'pnpm'

      - name: Install deps (root)
        run: pnpm install --frozen-lockfile

      - name: Run pnpm audit (high severity)
        run: pnpm audit --audit-level=high || (echo "⚠️ Обнаружены уязвимости уровня high+ — проверьте отчёт audit" && exit 1)

